name: nextcart
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  csv: ^6.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_map: ^8.3.1
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  geocoding: ^4.0.0
  geolocator: ^14.0.3
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  latlong2: ^0.10.1
  lottie: ^3.5.1
  smooth_page_indicator: ^2.0.1
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  supabase_flutter: ^2.15.0
  uuid: ^4.5.3
  webview_flutter: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/svg/
    - assets/lottie/

  fonts:
    - family: SF Pro
      fonts:
        - asset: assets/fonts/SF_PRO_DISPLAY.otf

    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400 
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700 