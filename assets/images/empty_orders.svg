<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360">
  <!-- Background blobs -->
  <circle cx="200" cy="155" r="130" fill="#EAF4FF" opacity="0.9"/>
  <circle cx="115" cy="85" r="55" fill="#F5E8C7" opacity="0.5"/>
  <circle cx="300" cy="245" r="70" fill="#D9F3FB" opacity="0.7"/>
  <circle cx="295" cy="70" r="38" fill="#F3ECFC" opacity="0.8"/>

  <!-- Sparkles -->
  <path d="M78 58 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#FACC15"/>
  <path d="M328 55 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#22D3EE"/>
  <path d="M330 280 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#F97316"/>

  <!-- Package box -->
  <path d="M130 150 h140 a12 12 0 0 1 12 12 v50 h-164 v-50 a12 12 0 0 1 12 -12z" fill="#0F172A"/>
  <path d="M130 150 h140 a12 12 0 0 1 12 12 v50 h-164 v-50 a12 12 0 0 1 12 -12z"
        fill="#1E293B" opacity="0.35"/>
  <!-- Box top -->
  <rect x="118" y="130" width="164" height="26" rx="8" fill="#0A84FF"/>
  <rect x="118" y="130" width="164" height="10" rx="5" fill="#3B82F6"/>
  <!-- Tape -->
  <rect x="185" y="130" width="30" height="26" fill="#FDBA74" opacity="0.9"/>
  <!-- Box label -->
  <rect x="150" y="175" width="100" height="12" rx="6" fill="#64748B" opacity="0.7"/>
  <rect x="165" y="195" width="70" height="8" rx="4" fill="#94A3B8" opacity="0.6"/>
  <!-- Open flap -->
  <path d="M118 130 l30 -18 l30 18 h-60z" fill="#0A84FF" opacity="0.6"/>
  <path d="M282 130 l-30 -18 l-30 18 h60z" fill="#0A84FF" opacity="0.4"/>

  <!-- Clock -->
  <circle cx="200" cy="262" r="26" fill="#FFFFFF"/>
  <circle cx="200" cy="262" r="22" fill="none" stroke="#0F172A" stroke-width="4"/>
  <path d="M200 248 v14 l10 6" stroke="#0F172A" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Floating products -->
  <rect x="48" y="150" width="34" height="52" rx="7" fill="#8B5CF6"/>
  <rect x="53" y="156" width="24" height="38" rx="4" fill="#A78BFA"/>
  <circle cx="65" cy="198" r="2.5" fill="#FFFFFF"/>

  <rect x="318" y="160" width="36" height="26" rx="10" fill="#F97316"/>
  <rect x="318" y="166" width="36" height="8" rx="4" fill="#FDBA74"/>
</svg>